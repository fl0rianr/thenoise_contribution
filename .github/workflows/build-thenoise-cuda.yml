name: Build TheNoise + CUDA (portable)

on:
  push:
    branches: ['ci/cuda-*']
    tags: ['v*']
  pull_request:
    paths:
      - .github/workflows/build-thenoise-cuda.yml
      - build-scripts/build_portable_cuda.sh
      - build-scripts/thenoise-cuda-launcher
      - build-scripts/qualify_thenoise.sh
      - pyproject.toml
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publish a CUDA release'
        type: boolean
        default: true
      qualify_nvidia:
        description: 'Run Anima qualification on an NVIDIA runner'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: thenoise-cuda-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    outputs:
      tag: ${{ steps.archive.outputs.tag }}
      version: ${{ steps.archive.outputs.version }}
      cuda: ${{ steps.archive.outputs.cuda }}
    steps:
      - name: Checkout TheNoise
        uses: actions/checkout@v4

      - name: Build CUDA bundle
        run: bash build-scripts/build_portable_cuda.sh

      - name: Package release archive
        id: archive
        shell: bash
        run: |
          set -euo pipefail
          ROOT="${{ env.THENOISE_ROOT }}"
          PY="$ROOT/bin/python3"
          VERSION=$("$PY" -c "import importlib.metadata as m; print(m.version('thenoise'))")
          CUDA=$("$PY" -c 'import torch; print(torch.version.cuda)')
          TAG="thenoise-${VERSION}-cuda${CUDA}"
          if [[ "$GITHUB_REF" != refs/tags/v* ]]; then
            TAG="${TAG}-${GITHUB_SHA:0:7}"
          fi
          BASE="${TAG}-cuda-x64"
          DEST="${{ runner.temp }}/cuda-release"
          mkdir -p "$DEST"
          tar -czf - -C "$ROOT" . | \
            split -b 1900M --numeric-suffixes=1 -a 2 --additional-suffix=.tar.gz \
              - "$DEST/${BASE}.part"
          parts=("$DEST/${BASE}.part"*.tar.gz)
          total=${#parts[@]}
          if (( total == 1 )); then
            mv "${parts[0]}" "$DEST/${BASE}.tar.gz"
          elif (( total <= 99 )); then
            for part in "${parts[@]}"; do
              suffix="${part##*.part}"
              number="${suffix%%.tar.gz}"
              mv "$part" "$DEST/${BASE}.part${number}-of-$(printf '%02d' "$total").tar.gz"
            done
            echo "$total" > "$DEST/${BASE}.partcount"
          else
            echo '::error::CUDA archive exceeds 99 parts'
            exit 1
          fi
          (cd "$DEST" && sha256sum -- *.tar.gz > "${BASE}.sha256")
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "cuda=$CUDA" >> "$GITHUB_OUTPUT"
          ls -lh "$DEST"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: thenoise-cuda-linux-x64
          path: ${{ runner.temp }}/cuda-release/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  qualify-nvidia:
    needs: build-linux
    if: github.event_name == 'workflow_dispatch' && inputs.qualify_nvidia == true
    runs-on: [self-hosted, Linux, X64, nvidia]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: thenoise-cuda-linux-x64
          path: ${{ runner.temp }}/cuda-release

      - name: Qualify portable bundle with Anima
        shell: bash
        run: |
          set -euo pipefail
          cd "${{ runner.temp }}/cuda-release"
          sha256sum -c -- *.sha256
          ROOT="${{ runner.temp }}/thenoise-cuda-bundle"
          mkdir -p "$ROOT"
          if compgen -G '*.partcount' >/dev/null; then
            cat -- *.part??-of-??.tar.gz | tar -xz -C "$ROOT"
          else
            tar -xzf ./*.tar.gz -C "$ROOT"
          fi
          "$ROOT/bin/python3" - <<'PY'
          import torch
          assert torch.version.cuda is not None and torch.version.hip is None
          assert torch.cuda.is_available(), 'NVIDIA GPU unavailable'
          print(torch.cuda.get_device_name(0))
          PY
          bash "$GITHUB_WORKSPACE/build-scripts/qualify_thenoise.sh" \
            --root "$ROOT" \
            --model-dir "${{ runner.temp }}/anima" \
            --out "${{ runner.temp }}/qualification.json"

      - name: Upload qualification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qualification-cuda-linux-x64
          path: ${{ runner.temp }}/qualification.json
          if-no-files-found: warn

  publish-release:
    needs: [build-linux, qualify-nvidia]
    if: |
      always() &&
      needs.build-linux.result == 'success' &&
      (needs.qualify-nvidia.result == 'success' || needs.qualify-nvidia.result == 'skipped') &&
      (github.event_name == 'push' ||
       (github.event_name == 'workflow_dispatch' && inputs.create_release == true))
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: thenoise-cuda-linux-x64
          path: ./cuda-release

      - name: Publish CUDA release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build-linux.outputs.tag }}
          VERSION: ${{ needs.build-linux.outputs.version }}
          CUDA: ${{ needs.build-linux.outputs.cuda }}
          QUALIFIED: ${{ needs.qualify-nvidia.result }}
        run: |
          set -euo pipefail
          (cd cuda-release && sha256sum -c -- *.sha256)
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release $TAG already exists; refusing to replace its assets"
            exit 1
          fi
          {
            echo "**TheNoise**: $VERSION"
            echo "**CUDA runtime**: $CUDA"
            echo '**Platform**: Linux x86_64'
            if [ "$QUALIFIED" = success ]; then
              echo '**GPU qualification**: passed (Anima)'
            else
              echo '**GPU qualification**: not run; validate on NVIDIA hardware before deployment'
            fi
            echo
            echo 'Portable Python and CUDA PyTorch are included. An NVIDIA driver is required.'
            echo 'Run `./bin/thenoise` after extraction.'
            echo 'For split archives, concatenate the numbered `.tar.gz` parts before extracting.'
          } > notes.md
          args=(--repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "TheNoise $VERSION CUDA $CUDA" --notes-file notes.md)
          if [ "$QUALIFIED" != success ] || [[ "$GITHUB_REF" != refs/tags/v* ]]; then
            args+=(--prerelease)
          fi
          gh release create "$TAG" "${args[@]}" cuda-release/*
